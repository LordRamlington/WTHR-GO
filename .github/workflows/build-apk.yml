name: Build WTHR-GO Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
  release:
    types:
      - created
      - published

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Capacitor 8 requires Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Setup Gradle optimization
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Capacitor 8 requires Node 22+
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Install Android SDK Platform 36 & Accept Licenses
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./WTHR-GO-debug.apk

      # Upload APK to Workflow Run Artifacts (Accessible in Actions tab)
      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WTHR-GO-Android-APK
          path: ./WTHR-GO-debug.apk
          retention-days: 30

      # Automatically publish and save the APK under GitHub Releases section
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "WTHR-GO v1.0.${{ github.run_number }}"
          body: |
            ## 📱 WTHR-GO Android APK (Build #${{ github.run_number }})

            ### Direct Download
            👉 **[WTHR-GO-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}/WTHR-GO-debug.apk)**

            ### Features
            - ⚡ **Live Doppler Radar**: OpenStreetMap & RainViewer tiles with past/nowcast loop.
            - 🔔 **Severe Weather Alerts**: Web push notifications, haptic vibration, and alert sounds.
            - 📅 **5-Day & Hourly Forecast**: High-resolution Open-Meteo numerical predictions.
            - 🔋 **Eco Battery Saver & Offline Mode**: Caching for zero-network use.
            - 🏷️ **AdMob Banner Unit**: Integrated standard 320x50 smart banner.

            ### Installation on Android
            1. Tap the **WTHR-GO-debug.apk** link above to download.
            2. Open the APK from your notification bar or Downloads folder.
            3. Tap **Install** (allow "Install Unknown Apps" for your browser if prompted).
          files: ./WTHR-GO-debug.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
