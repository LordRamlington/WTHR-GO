name: Build WTHR-GO Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  release:
    types:
      - created
      - published

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add Android Native Platform
        run: |
          npx cap add android || npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./WTHR-GO-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WTHR-GO-Android-APK
          path: ./WTHR-GO-debug.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (If Release Event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ./WTHR-GO-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
